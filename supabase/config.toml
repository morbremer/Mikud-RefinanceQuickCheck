
[functions.analyzeRefinanceDocument]
enabled = true
verify_jwt = false
import_map = "./functions/analyzeRefinanceDocument/deno.json"
entrypoint = "./functions/analyzeRefinanceDocument/index.ts"

[functions.chatWithMiko]
enabled = true
verify_jwt = false
import_map = "./functions/chatWithMiko/deno.json"
entrypoint = "./functions/chatWithMiko/index.ts"

# ── מרכז חיתום מוסדי (UnderwriterDashboard) ──
# verify_jwt stays false for all of these, same as every function above:
# withSupabase's own `auth` option (publishable/user/secret) does the real
# enforcement inside each function — the gateway-level verify_jwt is a
# coarser, redundant check that would also complicate the "secret"-mode
# server-to-server calls between these functions.

[functions.extractSingleChunk]
enabled = true
verify_jwt = false
import_map = "./functions/extractSingleChunk/deno.json"
entrypoint = "./functions/extractSingleChunk/index.ts"

